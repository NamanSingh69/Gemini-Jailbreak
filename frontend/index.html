<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%238b5cf6'/%3E%3Cstop offset='100%25' stop-color='%23ef4444'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='45' fill='url(%23g)'/%3E%3Cpath d='M50 15 L75 30 V55 C75 70 62 82 50 88 C38 82 25 70 25 55 V30 Z' fill='white' opacity='0.9'/%3E%3Cpath d='M45 55 L50 60 L60 45' stroke='%238b5cf6' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <meta name="description" content="Aura Security Lab — LLM Adversarial Testing Interface for Gemini Jailbreak Demos" />
  <title>Aura Security Lab — LLM Jailbreak Demo</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, Arial, sans-serif;
      color: #eaeef5;
      background-color: #0b0f17;
      background-image: linear-gradient(rgba(11, 15, 23, 0.85), rgba(11, 15, 23, 0.95)), url('/bg.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .card {
      background: #121826;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 16px;
    }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .chat {
      height: 60vh;
      overflow-y: auto;
      padding: 12px;
      background: #0f1422;
      border-radius: 8px;
      border: 1px solid #1f2937;
    }

    .bubble {
      padding: 10px 12px;
      margin: 8px 0;
      border-radius: 10px;
      white-space: pre-wrap;
    }

    .user {
      background: #20314f;
    }

    .model {
      background: #1f2b45;
    }

    .banner {
      padding: 8px 12px;
      background: #3b1a1a;
      color: #f6d3d3;
      border: 1px solid #6d2c2c;
      border-radius: 8px;
    }

    textarea,
    input,
    select,
    button {
      background: #0f1422;
      color: #eaeef5;
      border: 1px solid #2a364f;
      border-radius: 6px;
      padding: 8px;
    }

    button {
      cursor: pointer;
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
